name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore signing key
        env:
          WALKY_KEYSTORE: ${{ secrets.WALKY_KEYSTORE }}
        run: |
          test -n "${WALKY_KEYSTORE}"
          printf '%s' "${WALKY_KEYSTORE}" | base64 -d > release.keystore

      # Root inside the container: the runner's checkout is not owned by uid 1000.
      - name: Test and build
        env:
          WALKY_KEYSTORE_PASSWORD: ${{ secrets.WALKY_KEYSTORE_PASSWORD }}
        run: |
          test -n "${WALKY_KEYSTORE_PASSWORD}"
          docker compose run --rm --user 0:0 -e WALKY_KEYSTORE_PASSWORD build ./gradlew testDebugUnitTest assembleDebug \
            -PversionName="${GITHUB_REF_NAME#v}" -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "walky-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" "walky-${GITHUB_REF_NAME}.apk" --generate-notes
